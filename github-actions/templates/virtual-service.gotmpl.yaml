apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: argocd-virtual-service
spec:
  hosts:
    - argocd.karafra.net
  gateways:
    - infra-network/public-ingress-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host:  '{{ .Release.Name }}-actions-runner-controller-github-webhook-server.infra-cicd.svc.cluster.local'
            port:
              number: 80
