---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: github-actions-webhook-public-route
spec:
  parentRefs:
    - name: public-ingress-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: infra-network
  hostnames:
    - webhook.gha.karafra.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name:  '{{ .Release.Name }}-actions-runner-controller-github-webhook-server'
          group: ''
          kind: Service
          port: 80
          weight: 1

