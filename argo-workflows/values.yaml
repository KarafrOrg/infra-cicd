# values.yaml for Argo Workflows SSO via Dex (GitHub OAuth)
argo-workflows:
  crds:
    keep: false

  server:
    authModes:
      - server
    sso:
      enabled: false


# Optional: configure Ingress / Edge access (Istio HTTPRoute)
edge-access:
  httpRoute:
    hostnames:
      - argo-workflows.karafra.net
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - group: ""
            kind: Service
            name: infra-cicd-argo-workflows-server
            port: 2746
            weight: 1
  oauth2Proxy:
    externalSecret:
      secretName: &configSecretName argo-workflows-oauth2
      externalSecretKey: argo-workflows-oauth2-config
  oauth2-proxy:
    config:
      existingSecret: *configSecretName
      configFile: |-
        provider = "github"
        skip_provider_button = true
        cookie_secure = true
        reverse_proxy = true
        upstreams = ["http://infra-cicd-argo-workflows-server.infra-cicd.svc.cluster.local:80"]
        pass_host_header = true
        set_xauthrequest = true
        cookie_domain = ".karafra.net"
        whitelist_domains = [".karafra.net"]
        cookie_name = "_oauth2_proxy_seaweed"
        session_store_type = "cookie"

        # ⚠️ Required to avoid "missing email-domain" error
        email_domains = ["*"]

        # GitHub OAuth
        client_id = "<YOUR_GITHUB_CLIENT_ID>"
        client_secret = "<YOUR_GITHUB_CLIENT_SECRET>"
        scope = "user:email"
