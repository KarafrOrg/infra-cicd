# values.yaml for Argo Workflows SSO via Dex (GitHub OAuth)
argo-workflows:
  crds:
    keep: false

  server:
    authModes:
      - server
    sso:
      enabled: false


# Optional: configure Ingress / Edge access (Istio HTTPRoute)
edge-access:
  httpRoute:
    hostnames:
      - argo-workflows.karafra.net
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - group: ""
            kind: Service
            name: infra-cicd-argo-workflows-server
            port: 2746
            weight: 1
  oauth2Proxy:
    externalSecret:
      secretName: &configSecretName argo-workflows-oauth2
      externalSecretKey: argo-workflows-oauth2-config
  oauth2-proxy:
    config:
      existingSecret: *configSecretName
      configFile: |-
        provider = "github"
        github_org = "KarafrOrg"
        cookie_secure = true
        email-domain = '*'
