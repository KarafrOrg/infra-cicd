argo-workflows:
  crds:
    keep: false
  server:
    sso:
      enabled: true
      issuer: https://github.com/login/oauth/authorize
      clientId:
        name: github-app-credential
        key: clientId
      clientSecret:
        name: github-app-credential
        key: clientSecret
      redirectUrl: https://argo-workflows.karafra.net/oauth2/callback
      scopes:
        - read:user
        - user:email
edge-access:
  httpRoute:
    hostnames:
      - argo-workflows.karafra.net
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - group: ""
            kind: Service
            name: infra-cicd-argo-workflows-server
            port: 2746
            weight: 1
  oauth2Proxy:
    enabled: false
