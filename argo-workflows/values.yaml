# values.yaml for Argo Workflows SSO via Dex (GitHub OAuth)
argo-workflows:
  crds:
    keep: false

  server:
    authModes:
      - sso
    sso:
      insecureSkipVerify: true
      enabled: true

      # Dex issuer URL (internal cluster DNS)
      issuer: https://argocd-dex-server.argocd.svc.cluster.local:5556/api/dex

      clientId:
        name: github-app-credentials
        key: argoWorkflowsClientId
      clientSecret:
        name: github-app-credentials
        key: argoWorkflowsClientSecret

      # Public URL users access
      redirectUrl: https://argo-workflows.karafra.net/oauth2/callback

      # Standard OIDC scopes for login
      scopes:
        - openid
        - email
        - profile

# Optional: configure Ingress / Edge access (Istio HTTPRoute)
edge-access:
  httpRoute:
    hostnames:
      - argo-workflows.karafra.net
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - group: ""
            kind: Service
            name: infra-cicd-argo-workflows-server
            port: 2746
            weight: 1
  oauth2Proxy:
    enabled: false
