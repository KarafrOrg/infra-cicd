apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: delete-resource
spec:
  entrypoint: delete-resource
  serviceAccountName: argo-workflows

  arguments: &arguments
    parameters:
      - name: resource-name
      - name: resource-namespace
      - name: resource-kind

  templates:
    - name: delete-resource
      inputs:
        <<: *arguments
      container:
        image: bitnami/kubectl:latest
        # language=bash
        command: [ "/bin/sh", "-c" ]
        # language=bash
        args:
          - |
            set -eou pipefail
            echo "Deleting {{`{{inputs.parameters.resource-kind}}`}} {{`{{inputs.parameters.resource-name}}`}} in namespace {{`{{inputs.parameters.resource-namespace}}`}}"
            kubectl delete {{`{{inputs.parameters.resource-kind}}`}}/{{`{{inputs.parameters.resource-name}}`}} -n {{`{{inputs.parameters.resource-namespace}}`}}
            echo "{{`{{inputs.parameters.resource-kind}}`}} {{`{{inputs.parameters.resource-name}}`}} successfully deleted"
