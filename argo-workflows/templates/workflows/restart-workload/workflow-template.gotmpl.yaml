apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: restart-workload
spec:
  entrypoint: restart-workload
  serviceAccountName: argo-workflows
  arguments:
    parameters: &parameters
      - name: workload-name
      - name: workload-namespace
      - name: workload-kind
      - name: timeout
        value: "30m"

  templates:
    - name: restart-workload
      inputs:
        <<: *parameters
      container:
        image: bitnami/kubectl:latest
        # language=bash
        command: [ "/bin/sh", "-c" ]
        # language=bash
        args:
          - |
            set -eou pipefail
            echo "Restarting {{`{{inputs.parameters.workload-kind}}`}} {{`{{inputs.parameters.workload-name}}`}} in namespace {{`{{inputs.parameters.workload-namespace}}`}}"

            kubectl rollout restart {{`{{inputs.parameters.workload-kind}}`}}/{{`{{inputs.parameters.workload-name}}`}} \
              -n {{`{{inputs.parameters.workload-namespace}}`}}

            echo "Waiting for rollout to complete (timeout {{`{{inputs.parameters.timeout}}`}})..."

            kubectl rollout status {{`{{inputs.parameters.workload-kind}}`}}/{{`{{inputs.parameters.workload-name}}`}} \
              -n {{`{{inputs.parameters.workload-namespace}}`}} \
              --timeout={{`{{inputs.parameters.timeout}}`}}

            echo "{{`{{inputs.parameters.workload-kind}}`}} {{`{{inputs.parameters.workload-name}}`}} successfully restarted"
    - name: &exitHandler notify
      inputs:
        parameters:
          - name: message
      container:
        image: alpine:latest
        command: [ "/bin/sh", "-c" ]
        # language=bash
        args:
          - |
            set -eou pipefail
            echo "{{`{{inputs.parameters.message}}`}}"

  onExit: *exitHandler
